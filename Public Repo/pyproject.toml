[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbmrs"
version = "0.2.2"
description = "Physics-Based Market Risk Simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black",
  "ruff",
  "mypy",
  "pre-commit",
]
notebook = [
  "pandas>=3.0",
  "matplotlib>=3.11",
  "jupyter>=1.1",
  "nbconvert>=7.16",
  "ipykernel>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: longer-running stochastic regression checks",
]
